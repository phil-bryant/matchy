[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matchy"
version = "0.1.0"
description = "Transaction to email matching worker"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.136.3",
  "openai==2.41.0",
  "psycopg2-binary",
  "sqlalchemy==2.0.50",
  "uvicorn",
  "requests",
]

[tool.setuptools]
packages = ["matchy"]

[tool.mutmut]
paths_to_mutate = ["matchy/"]
only_mutate = ["matchy/scoring_core.py", "matchy/models.py"]
tests_dir = [
  "tests/py/test_scoring_core.py",
  "tests/py/test_scoring.py",
  "tests/py/test_models.py",
]
pytest_add_cli_args = ["-p", "no:hypothesis"]
do_not_mutate = [
  "matchy/scoring.py",
  "matchy/api.py",
  "matchy/repository.py",
  "matchy/mailcart_client.py",
  "matchy/cldr_cache.py",
  "matchy/ai_ranker.py",
  "matchy/service.py",
  "matchy/settings.py",
]
