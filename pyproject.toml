[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matchy"
version = "0.1.0"
description = "Transaction to email matching worker"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.136.3",
  "openai==2.41.0",
  "psycopg2-binary==2.9.12",
  "sqlalchemy==2.0.50",
  "uvicorn==0.49.0",
  "requests==2.34.2",
]

[tool.setuptools]
packages = ["matchy"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["matchy"]
data_file = "artifacts/coverage/.coverage"

[tool.coverage.report]
show_missing = true
omit = ["tests/*"]
precision = 2

[tool.mutmut]
paths_to_mutate = ["matchy/"]
only_mutate = ["matchy/scoring_core.py", "matchy/models.py"]
tests_dir = [
  "tests/py/test_scoring_core.py",
  "tests/py/test_scoring.py",
  "tests/py/test_models.py",
]
pytest_add_cli_args = ["-p", "no:hypothesis"]
do_not_mutate = [
  "matchy/scoring.py",
  "matchy/api.py",
  "matchy/repository.py",
  "matchy/match_writer.py",
  "matchy/mailcart_client.py",
  "matchy/cldr_cache.py",
  "matchy/ai_ranker.py",
  "matchy/service.py",
  "matchy/search.py",
  "matchy/enrichment.py",
  "matchy/caching.py",
  "matchy/near_duplicate.py",
  "matchy/email_move.py",
  "matchy/runtime_profile.py",
  "matchy/settings.py",
]
